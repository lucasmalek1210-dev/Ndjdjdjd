<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elton John Discography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="keys" aria-hidden="true"></div>
    <p class="eyebrow">The Rocket Man Archive</p>
    <h1>Elton John</h1>
    <p class="sub">Hover an album to spin it out. Click to open the tracklist. Click a song for the story behind it.</p>

    <div class="controls">
      <input id="search" type="search" placeholder="Search albums or songs…" aria-label="Search albums or songs" autocomplete="off" />
      <div class="eras" role="group" aria-label="Filter by decade">
        <button class="chip active" data-era="all">All</button>
        <button class="chip" data-era="1960">'60s</button>
        <button class="chip" data-era="1970">'70s</button>
        <button class="chip" data-era="1980">'80s</button>
        <button class="chip" data-era="1990">'90s</button>
        <button class="chip" data-era="2000">2000s</button>
        <button class="chip" data-era="2010">2010s</button>
        <button class="chip" data-era="2020">2020s</button>
      </div>
    </div>
  </header>

  <main>
    <p id="count" class="count" aria-live="polite"></p>
    <section id="grid" class="grid" aria-label="Albums"></section>
  </main>

  <!-- Album detail -->
  <div id="overlay" class="overlay" hidden>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="albumTitle">
      <button class="close" id="close" aria-label="Close">&times;</button>

      <div class="panel-left">
        <div id="panelCover" class="cover big"></div>
        <h2 id="albumTitle"></h2>
        <p id="albumMeta" class="meta"></p>
        <p id="albumAbout" class="about"></p>
      </div>

      <div class="panel-mid">
        <h3>Tracklist</h3>
        <ol id="tracks" class="tracks"></ol>
      </div>

      <aside id="songInfo" class="song-info" aria-live="polite"></aside>
    </div>
  </div>

  <footer>
    Fan-made reference. Covers Elton's studio albums, including his joint albums with other artists. Album art is generated.
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
